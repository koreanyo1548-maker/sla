<body>
<div id="app">
  <div id="asset-loader" role="status" aria-live="polite">
    <div class="loading-mark" data-ui-icon="forge"></div><strong class="wordmark">SLAGMA</strong>
    <p id="loading-message" data-i18n="quality.loading">Lighting the forge…</p>

    <div id="lobby-notice" role="status" aria-live="polite"></div>
    <div id="lobby-scroll">
      <section id="lobby-home" class="lobby-page" aria-labelledby="nav-home">
        <div class="journey-scene"><div class="journey-caption"><span id="stage-eyebrow"></span><h2 id="stage-name"></h2><p class="journey-story" data-i18n="quality.story"></p><p id="stage-meta" class="journey-meta"></p><div id="journey-progress" class="journey-progress"></div></div><div class="forge-beacon" aria-hidden="true"></div><div class="lobby-pills"><button id="open-milestones" class="milestone-pill" data-i18n-aria="milestone.title"><span data-ui-icon="milestone"></span><span id="milestone-strip-body" class="ms-body"></span><i id="milestone-home-dot" class="notify-dot" hidden></i></button><button id="open-codex" class="milestone-pill codex-pill" data-i18n-aria="codex.title"><span data-ui-icon="codex"></span><span id="codex-strip-body" class="ms-body"></span><i id="codex-home-dot" class="notify-dot" hidden></i></button></div></div>
        <div class="home-controls"><div class="home-heading"><span class="eyebrow" data-i18n="quality.command"></span><h2 data-i18n="quality.partyHeading"></h2><p data-i18n="quality.partyHint"></p></div><div class="section-label"><h3 data-i18n="lobby.party.title"></h3><button class="text-button" data-open-characters data-i18n="lobby.party.change"></button></div><div id="lobby-party-summary" class="lobby-party-summary"></div><div class="home-shortcuts"><button data-open-skills><span class="hs-row"><span class="hs-label" data-i18n="lobby.skills.equipped"></span><span id="home-skill-summary" class="hs-skill-icons"></span></span><span class="hs-row hs-stats"><span><span data-i18n="lobby.party.avgAtk"></span> <b id="home-party-atk">0</b></span><span><span data-i18n="lobby.party.totalHp"></span> <b id="home-party-hp">0</b></span></span></button></div><button id="growth-objective" class="growth-objective" data-open-upgrade></button>
        <button id="prepare-btn" class="primary"></button><p class="play-promise" data-i18n="quality.playHint"></p><div class="home-footnote"><span data-i18n="lobby.footnote"></span><span>v0924_1</span></div></div>
      </section>
      <section id="lobby-characters" class="lobby-page" hidden aria-labelledby="nav-characters"><div class="character-page-head"><div><span class="eyebrow" data-i18n="character.eyebrow"></span><h2 data-i18n="character.title"></h2></div><span class="character-count" id="character-count"></span></div><div id="growth-list"></div></section>
      <section id="lobby-skills" class="lobby-page" hidden aria-labelledby="nav-skills"><div class="character-page-head"><div><span class="eyebrow" data-i18n="skill.eyebrow"></span><h2 data-i18n="skill.title"></h2></div><span class="character-count" id="skill-count"></span></div><div id="skill-lobby-content"></div></section>
      <section id="lobby-upgrade" class="lobby-page" hidden aria-labelledby="nav-upgrade"><div class="character-page-head"><div><span class="eyebrow" data-i18n="upgrade.eyebrow"></span><h2 data-i18n="upgrade.title"></h2></div><span class="character-count" id="upgrade-count"></span></div>

        <div id="upgrade-list" class="upgrade-list"></div>
        <details class="recruit-details"><summary><span data-i18n="upgrade.details"></span> <span>⌄</span></summary><div class="character-modal-section"><strong data-i18n="upgrade.progress.title"></strong><div id="upgrade-progress" class="gacha-odds"></div></div></details>
      </section>

    </div>
    <nav id="lobby-nav" data-i18n-aria="lobby.nav.aria"><button id="nav-home" data-lobby-nav="home" aria-current="page"><span data-ui-icon="home"></span><b data-i18n="lobby.nav.home"></b></button><button id="nav-characters" data-lobby-nav="characters"><span data-ui-icon="heroes"></span><b data-i18n="lobby.nav.characters"></b><i id="growth-nav-dot" hidden></i></button><button id="nav-skills" data-lobby-nav="skills"><span data-ui-icon="skill"></span><b data-i18n="lobby.nav.skills"></b><i id="skill-nav-dot" hidden></i></button><button id="nav-upgrade" data-lobby-nav="upgrade"><span data-ui-icon="recruit"></span><b data-i18n="lobby.nav.upgrade"></b><i id="upgrade-nav-dot" hidden></i></button></nav>

       스테이지·편성·장착 스킬을 보여 주는 화면이었는데 셋 다 로비 홈에 이미 떠

  <!-- ===================== GAME SCREEN ===================== -->
  <div id="screen-game" class="screen">
    <div id="hud">
      <span class="wave-label" id="wave-label"></span>
      <div class="player-status">
        <div class="run-metrics" data-i18n-aria="battle.metricsAria">

          <span class="run-metric"><span data-i18n="battle.score"></span> <strong id="run-score">0</strong></span>
        </div>
        <div class="hp-wrap"><div class="hp-bar" id="player-hp-bar"></div>
          <div class="hp-label" id="player-hp-label"></div></div>
      </div>
    </div>
    <div id="combat-wrap">
      <canvas id="combat-canvas" width="440" height="480"></canvas>
      <!-- [2026-09-18 연출 세션 A] 저HP 경고 테두리와 보스 HP바. #combat-wrap의 ::before·::after는
           이미 배경 그라디언트와 피격 비네트가 쓰고 있어 별도 요소로 둔다. -->
      <div id="core-alert" aria-hidden="true"></div>
      <div id="boss-hp" aria-hidden="true"><div id="boss-hp-fill"></div></div>
      <div id="wave-type-badge" data-i18n-aria="battle.waveTypeAria"><span class="wave-type-caption" data-i18n="battle.waveCaption"></span><strong id="wave-type-name"></strong></div>
      
      
    </div>
    <div id="board-wrap">
      <div class="forge-panel-head"><div><span data-ui-icon="forge"></span><strong data-i18n="quality.forge"></strong></div><div id="energy-status-row" data-i18n-aria="battle.energyAria"><span class="energy-status-label" data-i18n="battle.energyLabel"></span><strong id="energy-display">0</strong></div></div>
      <div class="forge-orders-label"><span data-i18n="quality.orders"></span><span data-i18n="quality.ordersHint"></span></div>
      <div id="order-status-row" data-i18n-aria="order.statusAria">
        <div id="order-gauge-wrap" class="order-gauge-wrap" data-i18n-title="order.gaugeTitle">
          <div class="order-gauge-track"><div class="order-gauge-fill" id="order-gauge-bar"></div></div>
          <div class="order-gauge-label" id="order-gauge-label"></div>
        </div>
        <div id="order-stock" class="order-stock" data-i18n-title="order.stockTitle"><span data-i18n="order.stockLabel"></span> <span id="order-stock-count">0</span></div>
      </div>
      <div id="order-sheet-panel"></div>
      <div class="board-caption"><span data-i18n="quality.board"></span><span data-i18n="quality.mergeHint"></span></div><div id="board"></div>
      <div id="generator-row">
        <button id="batch-merge-btn" type="button">
          <span class="bm-cd"></span>
          <span class="bm-label"><b data-i18n="battle.batchMerge.label"></b><span class="bm-timer"></span></span>
        </button>
        <button id="generator-btn">
          <span class="gen-fill" id="gen-fill"></span>

        </button>
      </div>
      <div class="forge-skills-label"><span data-i18n="quality.skills"></span><span data-i18n="quality.skillsHint"></span></div><div id="skill-row" data-i18n-aria="battle.skillRowAria"></div>
      <p id="forge-hint" role="status" aria-live="polite"></p>
      <div class="keyboard-hints" aria-hidden="true"><span><kbd>Space</kbd> <i data-i18n="quality.keyGenerate"></i></span><span><kbd>M</kbd> <i data-i18n="quality.keyMerge"></i></span><span><kbd>Q</kbd><kbd>E</kbd> <i data-i18n="quality.skills"></i></span></div>
    </div>
    <div id="order-detail" hidden role="dialog" aria-modal="true" data-i18n-aria="order.detailAria"><div class="order-detail-card"><div id="order-detail-content"></div><div class="order-detail-actions"><button id="order-detail-discard" data-i18n="order.discard"></button><button id="order-detail-close" data-i18n="common.close"></button></div></div></div>

        <p id="tutorial-body"></p>

        <span id="cinematic-kicker"></span>
        <strong id="cinematic-title"></strong>
        <span id="cinematic-sub"></span>
      </div>
    </div>
  </div>

  <!-- ===================== RESULT SCREEN ===================== -->

    <div id="result-sub" style="color:var(--dim);font-size:13px;"></div>
    <div id="result-stats"></div><div id="result-reward" aria-live="polite"></div>

  <button id="tools-toggle" data-i18n-title="options.title" data-i18n-aria="options.title"><span data-ui-icon="settings"></span></button>

  <!-- [2026-09-23] 톱니 버튼이 이 옵션 팝업을 직접 연다. 언어 · 효과음 · 전투 종료를 제공하고,
       데이터 초기화는 DEV_ONLY 구간이라 출시 빌드에서 마크업과 동작을 함께 제거한다.
       [2026-09-22] 옵션 팝업 — 언어 · 효과음.
       효과음 토글을 도구 메뉴의 독립 아이콘에서 이름과 상태가 보이는 항목으로 옮겼다.
       플레이어용 게임 설명서는 제거했다.
       언어 목록은 등록된 언어 파일에서 만들어지므로 i18n/ 에 파일이 하나 늘면
       버튼도 하나 는다 — 이 마크업은 손대지 않는다. -->
  <div id="options-panel" hidden role="dialog" aria-modal="true" data-i18n-aria="options.title">
    <div class="options-card">
      <h2 data-i18n="options.title"></h2>
      <section class="options-section">
        <h3 data-i18n="options.language.title"></h3>
        <div id="lang-list" class="lang-list"></div>
        <p class="options-note" id="options-language-note" data-i18n="options.language.note"></p>
      </section>
      <section class="options-section">
        <h3 data-i18n="options.sound.title"></h3>
        <button id="sound-toggle" class="options-item sound-option" data-i18n-aria="tools.soundAria" aria-pressed="false"></button>
      </section>
      <section id="run-options-section" class="options-section" hidden>
        <button id="options-quit-run" class="options-item danger" data-i18n="tools.quitTitle"></button>
      </section>
      <!-- DEV_ONLY_START -->
      <section class="options-section">
        <button id="reset-data-btn" class="options-item danger" data-i18n="options.reset"></button>
        <p id="reset-data-note" class="options-note" data-i18n="options.reset.note"></p>
      </section>
      <!-- DEV_ONLY_END -->
      <button id="options-close" data-i18n="common.close"></button>
    </div>
  </div>

  <div id="recruit-modal" class="reveal-overlay" hidden><section class="reveal-dialog" role="dialog" aria-modal="true" aria-labelledby="reveal-title"><div id="reveal-content"></div><div class="reveal-actions"><button id="reveal-close" class="primary" data-i18n="common.continue"></button></div></section></div>
  <!-- [2026-09-18 연출 세션 B] 승급으로 성급 패시브가 열리면 이 카드가 아래에서
       올라온다. 해금 시점(3성) 판단은 PassiveUnlockTable을 읽는 쪽이 한다. -->
  <div id="passive-reveal" hidden role="dialog" aria-modal="true" data-i18n-aria="growth.passiveUnlocked">
    <div class="passive-reveal-card">
      <span class="passive-reveal-kicker" data-i18n="growth.passiveUnlocked"></span>
      <strong id="passive-reveal-name"></strong>
      <ul id="passive-reveal-lines" class="passive-lines"></ul>
      <button id="passive-reveal-close" data-i18n="common.confirm"></button>
    </div>
  </div>
  <!-- [2026-09-18 연출 세션 A] 화면 경계를 넘나드는 연출용 계층. #combat-wrap은
       overflow:hidden이라 보드에서 전장으로 날아가는 연출을 담을 수 없다. -->
  <div id="fx-layer" aria-hidden="true"></div>
</div>

<!-- DEV_ONLY_START -->
<script>
  window.addEventListener('DOMContentLoaded',()=>{
    const reset=document.querySelector('#reset-data-btn');
    if(!reset)return;
    reset.onclick=()=>{
      if(GameState.current!=='lobby'||!confirm(t('notice.reset.confirm')))return;
      const result=CampaignStore.remove();
      if(!result.ok){Campaign.warn(result.error);return;}
      alert(t('notice.reset.done'));
      location.reload();
    };
  });
</script>
<!-- DEV_ONLY_END -->

<!-- [2026-09-19 세션 7-1] 분석 구현체를 꽂는다. DOMContentLoaded보다 먼저 도는
     자리라 첫 이벤트(session_start)가 어댑터를 지나간다.
     게임 ID·SDK 키는 여기 그대로 둔다. HTML5 빌드는 JS가 브라우저에 내려가므로
     저장소가 공개든 비공개든 이 두 값은 어차피 드러난다 — 서버 비밀이 아니라
     GA 측정 ID 같은 클라이언트 키다.
     버전은 <meta name="slagma-build">를 읽는다. 빌드 문자열이 한 곳에만 있게. -->
<script>
  installPlatform({
    analytics: createByteBrewAnalytics(
      'tTKrguQdr',
      'Bko4Ii5EjGZ3q3ShTBb9Lu+DcZRVKXIfchEgSAH3XzONa+qvNxNSVHiplm64pEw2',
      document.querySelector('meta[name="slagma-build"]')?.content || 'unknown'
    ),
  });
</script>

<!-- [2026-09-24] 가로 화면은 quality.css의 전장·대장간 2열 배치를 사용한다. -->
