<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>슬래그마 · 밸런스 에디터</title>
<style>
  /* [2026-09-17] 게임(index.html)과 같은 기본 디자인 토큰을 쓴다 — 프레임·패널·텍스트 계열만.
     --ember/--bad 같은 개발용 상태 표시는 역할이 달라 토큰을 따로 두되 값만 새 팔레트에 맞춘다. */
  :root{
    --bg:#171C20; --surface:#222C30; --surface-2:#2A363B; --border:#3D4A4F;
    --text-primary:#F2E9D8; --text-secondary:#B7B7AC; --text-disabled:#747A78;
    --surface-disabled:#2B3133; --border-disabled:#41494C;
    --primary:#DDB86A; --primary-text:#171C20;
    --energy:#5EDBF4; --danger:#F2645A; --success:#5CCB8A;

    --panel:var(--surface); --panel2:var(--surface-2);
    --text:var(--text-primary); --dim:var(--text-secondary);
    --accent:var(--primary);
    --ember:#F77A3D;          /* 변경된 값 표시(개발용) */
    --bad:var(--danger);      /* 검증 실패 표시(개발용) */
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;background:var(--bg);color:var(--text);
    font-family:"Segoe UI",-apple-system,BlinkMacSystemFont,sans-serif;}
  body{display:flex;flex-direction:column;}
  header{flex:none;display:flex;align-items:center;gap:12px;padding:10px 16px;
    background:var(--panel);border-bottom:1px solid var(--border);}
  header h1{font-size:16px;margin:0;flex:1;}
  header button{padding:7px 14px;border-radius:6px;border:1px solid var(--border);
    background:var(--panel2);color:var(--text);cursor:pointer;font-size:12px;}
  #status{font-size:12px;color:var(--dim);}
  #layout{flex:1;min-height:0;display:flex;}
  #editor-col{flex:1;min-width:0;overflow-y:auto;padding:16px;}
  #game-col{flex:none;width:420px;border-left:1px solid var(--border);background:var(--bg);
    display:flex;align-items:stretch;justify-content:center;}
  #game-col iframe{width:100%;border:0;background:var(--bg);}
  @media (max-width:900px){
    #layout{flex-direction:column;}
    #game-col{width:auto;height:70vh;border-left:0;border-top:1px solid var(--border);}
  }
  #error-banner{display:none;margin:16px;padding:14px 16px;border:1px solid var(--bad);
    background:var(--surface);border-radius:8px;font-size:13px;line-height:1.7;color:var(--danger);}
  #error-banner.show{display:block;}
  #error-banner code{background:var(--bg);padding:1px 6px;border-radius:4px;color:var(--primary);}
  .note{color:var(--dim);font-size:12px;margin-bottom:14px;}
  .editor-section{background:var(--panel2);border:1px solid var(--border);border-radius:10px;
    padding:12px;margin-bottom:12px;}
  .editor-section h3{margin:0 0 8px;font-size:13px;color:var(--accent);}
  .editor-row{display:flex;align-items:center;justify-content:space-between;gap:8px;
    font-size:12px;padding:4px 0;border-bottom:1px dashed var(--surface-2);}
  .editor-row:last-child{border-bottom:none;}
  .editor-row label{color:var(--dim);flex:1;}
  .editor-row input{width:110px;padding:5px 6px;background:var(--bg);border:1px solid var(--border);
    border-radius:6px;color:var(--text);font-size:12px;}
  .editor-row select{width:110px;padding:5px 6px;background:var(--bg);border:1px solid var(--border);
    border-radius:6px;color:var(--text);font-size:12px;}
  .editor-row input[type="checkbox"]{width:20px;height:20px;accent-color:var(--accent);}
  .editor-row.flagged label{color:var(--primary);}
  .editor-buttons{display:flex;gap:10px;margin:14px 0 30px;flex-wrap:wrap;position:sticky;bottom:0;
    background:var(--bg);padding:10px 0;}
  .editor-buttons button{padding:10px 16px;border-radius:8px;border:none;font-weight:600;
    font-size:13px;cursor:pointer;}
  #apply-btn{background:var(--accent);color:var(--primary-text);}
  #reset-btn{background:var(--surface-2);color:var(--danger);}
</style>
</head>
<body>
  <header>
    <h1>⚙ 슬래그마 밸런스 에디터</h1>
    <span id="status">불러오는 중…</span>
    <button id="reload-btn">게임 새로고침</button>
  </header>
  <div id="error-banner"></div>
  <div id="layout">
    <div id="editor-col">
      <div id="editor-panel"></div>
    </div>
    <div id="game-col"><iframe id="game-frame" title="슬래그마 (플레이테스트)"></iframe></div>
  </div>

<script>
/* =====================================================================
   이 파일은 index.html의 게임 코드를 건드리지 않는 별도 개발용 도구다.
   같은 폴더의 index.html을 iframe으로 실행해 그 안의 DEFAULT_CONFIG 등을
   직접 읽고 고치므로, 게임의 설정 스키마가 바뀌어도 이 파일을 따로
   손볼 필요가 없다 — index.html이 유일한 소스다.

   반드시 index.html과 같은 폴더에서 로컬 서버로 열어야 한다(예:
   `python3 -m http.server`, `npx serve`). file://로 직접 열면
   브라우저가 iframe 간 접근을 차단해 아래에서 안내 메시지를 띄운다.

   "적용"은 index.html의 밸런스 에디터가 원래 하던 것과 동일하게 —
   현재 켜져 있는 게임(iframe)의 CONFIG를 즉시 바꿔 바로 플레이테스트할
   수 있게 할 뿐, index.html 파일 자체를 고치지는 않는다. 값을 코드에
   영구 반영하려면 이 화면에서 확인한 값을 index.html의 DEFAULT_CONFIG에
   직접 옮겨 적어야 한다.
   ===================================================================== */
const $=s=>document.querySelector(s);
const $$=s=>[...document.querySelectorAll(s)];

let gw=null; // game iframe의 window
let refs=null; // gw에서 뽑아온 설정 객체·상수 참조

function showError(html){
  const el=$('#error-banner');
  el.innerHTML=html;
  el.classList.add('show');
  $('#status').textContent='연결 실패';
}
function hideError(){ $('#error-banner').classList.remove('show'); }

// index.html의 CONFIG·DEFAULT_CONFIG 등은 최상위 스크립트의 const/let이라
// window의 속성이 아니다(같은 문서의 다른 <script>에서는 이름으로 바로 보이지만
// iframe.contentWindow.DEFAULT_CONFIG처럼 밖에서 속성으로 읽으면 undefined다).
// 그래서 iframe 문서 안에 다리 역할의 <script>를 하나 심어, 그 스크립트가
// 같은 전역 스코프에서 필요한 것들을 window.__slagmaBridge에 옮겨 붙인다.
const BRIDGE_SRC = `
window.__slagmaBridge = {
  DEFAULT_CONFIG, FACTORY_DEFAULT_CONFIG, cloneConfig, replaceObjectContents,
  COMBAT_FACTOR_KEYS, COMBAT_FACTOR_LABELS, MISSILE_KEYS, MISSILE_DEFS,
  RARITY_KEYS, RarityTable, CurrencyTable, MILESTONE_TABLE, CharacterGrowthRules,
  getConfig(){ return CONFIG; },
  setConfig(v){ CONFIG = v; },
};
`;

function loadGame(){
  hideError();
  $('#status').textContent='불러오는 중…';
  const frame=$('#game-frame');
  frame.onload=()=>{
    let bridge;
    try{
      const w=frame.contentWindow, doc=frame.contentDocument;
      // 접근 가능한지 먼저 확인 — file://에서 열었으면 여기서 예외가 난다.
      void doc.title;
      const script=doc.createElement('script');
      script.textContent=BRIDGE_SRC;
      doc.body.appendChild(script);
      bridge=w.__slagmaBridge;
      if(!bridge || !bridge.DEFAULT_CONFIG || !bridge.cloneConfig || !bridge.replaceObjectContents){
        throw new Error('index.html에서 필요한 값(DEFAULT_CONFIG 등)을 찾지 못했습니다.');
      }
    }catch(e){
      showError(`
        <b>index.html에 접근할 수 없습니다.</b><br>
        이 파일을 <code>file://</code>로 직접 열면 브라우저가 iframe 간 접근을 막습니다.
        index.html과 같은 폴더에서 아래처럼 로컬 서버로 열어주세요.<br><br>
        <code>python3 -m http.server</code> 실행 후
        <code>http://localhost:8000/balance-editor.html</code> 접속<br><br>
        (오류: ${e.message})`);
      return;
    }
    gw=frame.contentWindow;
    refs=bridge;
    $('#status').textContent='연결됨 — 적용 시 오른쪽 게임에 바로 반영됩니다';
    Editor.build();
  };
  frame.src='index.html?t='+Date.now();
}

const Editor = {
  build(){
    const panel=$('#editor-panel');
    panel.innerHTML=`
      <div class="note">"적용"은 index.html 파일을 고치지 않습니다 — 오른쪽에 떠 있는 게임(iframe)의 CONFIG만
      즉시 바꿔 바로 플레이테스트하게 해줍니다. 값을 코드에 영구히 반영하려면 여기서 확인한 값을
      index.html의 DEFAULT_CONFIG에 직접 옮겨 적으세요.</div>
      ${this.flags('개발 옵션',[['featureFlags.criticalMerge','크리티컬 머지'],['featureFlags.goldenPiece','골든 피스']])}
      ${this.section('플레이어',[['player.atkSpeed','기본 공격속도'],['player.damageReductionBase','기본 피해 감소율'],['player.projectileSpeed','투사체 속도',true]])}
      ${this.combatFactorSections()}
      ${this.section('전장 논리 해상도',[['field.width','너비'],['field.height','높이'],['field.playerOffsetY','영웅 하단 거리'],['field.maxAnisotropy','표시 왜곡 허용치'],['field.coreY','핵 중심 Y'],['field.coreRadius','핵 반지름'],['field.enemyContactGap','적과 핵 간격'],['field.spawnMargin','좌우 출현 여백']])}
      ${this.section('타격감 (연출 전용)',[['presentation.hitStopSec','치명타 히트스톱',true],['presentation.killStopSec','처치 히트스톱',true],['presentation.bossKillStopSec','보스 처치 히트스톱',true],['presentation.hitStopTimeScale','히트스톱 배속',true],['presentation.hitStopCooldownSec','히트스톱 최소 간격',true],['presentation.hitPushPx','피격 밀림 거리',true],['presentation.hitPushRecoverSec','밀림 복귀 시간',true],['presentation.squashSec','피격 압축 시간',true],['presentation.squashAmount','피격 압축 강도',true],['presentation.killAfterimageSec','처치 잔상 시간',true]])}
      ${this.section('히트박스·명중 판정',[['hitbox.enemyRadius','일반 적 반지름'],['hitbox.bossRadius','보스 반지름'],['hitbox.laserEdgePad','직선탄 여유'],['hitbox.homingHitDist','유도탄 명중 거리'],['hitbox.projectileRangeMul','직선탄 사거리 배수']])}
      ${this.section('생성기·피스',[['generator.costPerPiece','피스 생성 비용'],['generator.holdIntervalSec','연속 생성 간격'],['colors.count','활성 색상 수'],['criticalMerge.chance','크리티컬 확률',true],['criticalMerge.bonusTiers','크리티컬 추가 티어',true],['goldenPiece.chance','골든 확률',true],['goldenPiece.bonusTiers','골든 보너스 티어',true]])}
      ${this.section('주문서',[['orderSheet.qualityWeights.0','1성 확률'],['orderSheet.qualityWeights.1','2성 확률'],['orderSheet.qualityWeights.2','3성 확률'],['orderSheet.qualityPityMisses','3성 보정 횟수'],['orderSheet.starSecondThreshold','별 2개 기준'],['orderGauge.maxCharge','게이지 완충치'],['orderGauge.ordersPerGrant','완충 시 주문서 수'],['orderGauge.midBossOrders','중간보스 주문서 수'],['orderGauge.pointPerEnergy','에너지 1 소모 점수'],['orderGauge.pointPerMerge','머지 1회 점수']])}
      ${this.section('점수·에너지',[['scoring.normalKill','일반 적 점수'],['scoring.midBoss','중간보스 점수'],['scoring.finalBoss','최종보스 점수'],['scoring.pointsPerGrant','지급 기준 점수'],['scoring.energyPerGrant','기준당 에너지'],['scoring.startEnergy','시작 에너지']])}
      ${this.section('스테이지·선형 물량',[['stage.stageOneHpMul','스테이지 1 HP 배율'],['stage.startWave','선형 시작 WAVE'],['stage.endWave','선형 종료 WAVE'],['stage.startCount','시작 개체 수'],['stage.endCount','종료 개체 수']])}
      ${this.attackSections()}
      ${this.skillSections()}
      ${this.section('적 기본값',[['enemy.base.hp','기본 HP'],['enemy.base.atk','기본 공격력'],['enemy.defenseGrowth.freeStages','방어력 0 유지 스테이지'],['enemy.defenseGrowth.perStage','이후 스테이지당 방어력'],['enemy.base.atkSpeed','공격속도'],['enemy.base.travelTimeSec','기본 공격 위치 도달(초)'],['enemy.hpStepPct','난이도당 HP 증가율'],['enemy.atkStepPct','난이도당 공격력 증가율']])}
      ${this.section('적 타입',[['enemy.types.melee.hpMul','근접 HP 배율'],['enemy.types.melee.atkMul','근접 공격 배율'],['enemy.types.melee.defMul','근접 방어 배율'],['enemy.types.melee.travelTimeSec','근접 공격 위치 도달(초)'],['enemy.types.ranged.hpMul','원거리 HP 배율'],['enemy.types.ranged.atkMul','원거리 공격 배율'],['enemy.types.ranged.defMul','원거리 방어 배율'],['enemy.types.ranged.travelTimeSec','원거리 공격 위치 도달(초)'],['enemy.types.ranged.rangePct','원거리 사거리 비율'],['enemy.types.ranged.projectileSpeed','원거리 투사체 속도'],['enemy.types.tank.hpMul','탱커 HP 배율'],['enemy.types.tank.atkMul','탱커 공격 배율'],['enemy.types.tank.defMul','탱커 방어 배율'],['enemy.types.tank.travelTimeSec','탱커 공격 위치 도달(초)']])}
      ${this.section('WAVE 타이밍 (혼성·스테이지 1~2)',[['waveTiming.durationSec','WAVE 기본 시간'],['waveTiming.earlyTransitionAlivePct','조기 전환 생존 비율'],['waveTiming.spawnRatios.0','1차 스폰 비율'],['waveTiming.spawnRatios.1','2차 스폰 비율'],['waveTiming.spawnRatios.2','3차 스폰 비율'],['waveTiming.spawnTimesSec.0','1차 스폰 시간'],['waveTiming.spawnTimesSec.1','2차 스폰 시간'],['waveTiming.spawnTimesSec.2','3차 스폰 시간']])}
      ${this.section('보스',[['boss.midHpExtraMul','중간보스 HP 배율'],['boss.finalHpExtraMul','최종보스 HP 배율'],['boss.midAtkMul','중간보스 공격 배율'],['boss.finalAtkMul','최종보스 공격 배율']])}
      ${this.selects('보스 타입',[['boss.midType','중간보스'],['boss.finalType','최종보스']])}
      ${this.metaSections()}
      <div class="editor-buttons"><button id="apply-btn">적용</button><button id="reset-btn">기본값 복원</button></div>`;
    $('#apply-btn').onclick=()=>this.apply();
    $('#reset-btn').onclick=()=>this.reset();
  },
  section(title,rows){
    return `<div class="editor-section"><h3>${title}</h3>${rows.map(([path,label,flagged])=>`<div class="editor-row ${flagged?'flagged':''}"><label>${label}${flagged?' (조정가능)':''}</label><input type="number" step="any" data-path="${path}" value="${this.getVal(path)}"></div>`).join('')}</div>`;
  },
  flags(title,rows){
    return `<div class="editor-section"><h3>${title}</h3>${rows.map(([path,label])=>`<div class="editor-row"><label>${label}</label><input type="checkbox" data-path="${path}" ${this.getVal(path)?'checked':''}></div>`).join('')}</div>`;
  },
  selects(title,rows){
    const labels={melee:'근접',ranged:'원거리',tank:'탱커'};
    return `<div class="editor-section"><h3>${title}</h3>${rows.map(([path,label])=>`<div class="editor-row"><label>${label}</label><select data-path="${path}">${Object.entries(labels).map(([value,text])=>`<option value="${value}" ${this.getVal(path)===value?'selected':''}>${text}</option>`).join('')}</select></div>`).join('')}</div>`;
  },
  combatFactorSections(){
    const {COMBAT_FACTOR_KEYS,COMBAT_FACTOR_LABELS,MISSILE_KEYS,MISSILE_DEFS}=refs;
    const labels=Object.fromEntries(COMBAT_FACTOR_KEYS.map(key=>[key,COMBAT_FACTOR_LABELS[key].long]));
    const global=this.section('1차 팩터 · 전 공격 공통',COMBAT_FACTOR_KEYS.map(key=>[`combatFactors.global.${key}`,labels[key]]));
    const modules=MISSILE_KEYS.map(moduleKey=>this.section(`2차 팩터 · ${MISSILE_DEFS[moduleKey].label}`,COMBAT_FACTOR_KEYS.map(key=>[`combatFactors.modules.${moduleKey}.${key}`,labels[key]]))).join('');
    const rules=this.section('피해 계산 규칙',[['combatRules.critChanceCap','치명타율 상한'],['combatRules.defenseIgnoreCap','방어 무시율 상한'],['combatRules.pierceRateCap','관통 피해율 상한'],['combatRules.defenseConstant','방어 계산 상수'],['combatRules.minimumDamage','최소 피해']]);
    return global+modules+rules;
  },
  attackSections(){
    const {DEFAULT_CONFIG,MISSILE_KEYS,MISSILE_DEFS}=refs;
    const shared=[...DEFAULT_CONFIG.attackModules.damageBonusByLevel.map((_,i)=>[`attackModules.damageBonusByLevel.${i}`,`Lv.${i+1} 공격력 증가율`]),...DEFAULT_CONFIG.attackModules.speedBonusByLevel.map((_,i)=>[`attackModules.speedBonusByLevel.${i}`,`Lv.${i+1} 공격속도 증가율`])];
    const extraRows={
      chain:[['unusedTargetBonus','잔여 연결 보너스(전역)']],
      explosion:[['secondary.damagePct','2차 폭발 피해 비율(전역)'],['secondary.radiusPct','2차 폭발 반경 비율(전역)']],
      scatter:[['spreadAngleDeg','탄환 간 각도'],['centerDamageBonus','중앙탄 추가 피해(전역)']],
      laser:[['empowered.chance','강화 발동 확률(전역)'],['empowered.damagePct','강화 시 피해 증가(전역)'],['empowered.widthPct','강화 시 폭 증가(전역)'],['focused.damagePct','단일 적중 시 피해 증가(전역)']],
    };
    const specialLabels={targets:'기본 타깃',radius:'기본 범위',projectiles:'기본 발사 수',width:'기본 광선 폭'};
    const bonusLabels={targets:'추가 타깃',radius:'범위 증가',projectiles:'추가 발사',width:'폭 증가'};
    const sections=MISSILE_KEYS.map(key=>{
      const meta=MISSILE_DEFS[key],def=DEFAULT_CONFIG.attackModules[key],sp=meta.special;
      const rows=[['baseDamageMul','기본 피해 배율'],[sp.base,specialLabels[sp.stat]||`기본 ${sp.label}`],...(extraRows[key]||[]),...def[sp.table].map((_,i)=>[`${sp.table}.${i}`,`Lv.${i+1} ${bonusLabels[sp.stat]||sp.label}`])];
      return this.section(`미사일 · ${meta.label}`,rows.map(([path,label])=>[`attackModules.${key}.${path}`,label]));
    }).join('');
    return this.section('미사일 공통 강화',shared)+sections;
  },
  skillSections(){
    const {DEFAULT_CONFIG}=refs;
    let html=this.section('스킬 공통',[['skillPickCount','장착 개수'],['skillEnergy.firstCost','첫 사용 에너지'],['skillEnergy.costStep','사용마다 증가량'],['meta.skill.durationUptimeGap','지속형 쿨타임 여유(최대 지속 대비)',true]]);
    return html+Object.entries(DEFAULT_CONFIG.skills).map(([key,def])=>{const rows=[[`skills.${key}.baseEffect`,'1성 액티브 효과'],[`skills.${key}.stats.base.atk`,'Lv.1 공격'],[`skills.${key}.stats.base.def`,'Lv.1 방어'],[`skills.${key}.stats.base.hp`,'Lv.1 체력'],[`skills.${key}.stats.perLevel.atk`,'레벨당 공격'],[`skills.${key}.stats.perLevel.def`,'레벨당 방어'],[`skills.${key}.stats.perLevel.hp`,'레벨당 체력']];if(!def.cooldownFromMaxDuration)rows.splice(1,0,[`skills.${key}.cooldownSec`,'쿨타임']);if(def.durationSec!==undefined)rows.push([`skills.${key}.durationSec`,def.growth==='duration'?'1성 지속 시간':'지속 시간']);[['durationPerStar','성급당 지속 증가'],['stunSec','스턴 시간'],['slowPct','감속 비율'],['slowSec','감속 시간'],['knockbackPx','밀어내기 거리']].forEach(([k,label])=>{if(def[k]!==undefined)rows.push([`skills.${key}.${k}`,label,true]);});return this.section(`스킬 · ${def.name}`,rows);}).join('');
  },
  metaSections(){
    const {DEFAULT_CONFIG,CharacterGrowthRules,MILESTONE_TABLE,CurrencyTable,RARITY_KEYS,RarityTable}=refs;
    let html=this.section('소환', [['meta.gacha.cost','소환 가격(별불)',true],['meta.gacha.resultsPerPull','1회 결과 수',true],['meta.gacha.startStarfire','초기 별불',true],['meta.gacha.characterWeight','캐릭터 비율',true],['meta.gacha.skillWeight','스킬 비율',true]]);
    html+=this.section('스킬 성장',[['meta.skill.duplicateShards','중복 스킬 조각'],...Array.from({length:CharacterGrowthRules.maxStars-1},(_,i)=>[`meta.skill.shardSteps.${i}`,`${i+1}→${i+2}성 조각`]),...Array.from({length:CharacterGrowthRules.maxStars-1},(_,i)=>[`meta.skill.starStepPct.${i+1}`,`${i+1}성 → ${i+2}성 효과 상승률`])]);
    html+=this.section('마일스톤 (반복형 · 가안)',MILESTONE_TABLE.flatMap(row=>[[`meta.milestones.${row.id}.target`,`${row.name} · 첫 목표`,true],[`meta.milestones.${row.id}.targetStep`,`${row.name} · 단계당 목표 증가`,true],[`meta.milestones.${row.id}.reward`,`${row.name} · 보상(${CurrencyTable[row.currencyId].name})`,true],[`meta.milestones.${row.id}.rewardStep`,`${row.name} · 단계당 보상 증가`,true],[`meta.milestones.${row.id}.rewardCap`,`${row.name} · 보상 상한(0=없음)`,true]]));
    html+=this.section('수호자 성급 성장 배율',Array.from({length:CharacterGrowthRules.maxStars-1},(_,i)=>[`meta.character.starStepPct.${i+1}`,`${i+1}성 → ${i+2}성 상승률`]));
    html+=RARITY_KEYS.slice().reverse().map(key=>{
      const r=RarityTable[key];
      const rows=[['statMul','능력치 배율'],['levelCostMul','레벨업 비용 배율'],['gachaWeight','등급 가중치'],['duplicateShards','중복 시 조각'],
        ...Array.from({length:CharacterGrowthRules.maxStars-1},(_,i)=>[`shardSteps.${i}`,`${i+1}→${i+2}성 조각`])];
      return this.section(`희귀도 · ${r.name}`,rows.map(([path,label])=>[`meta.rarity.${key}.${path}`,label,true]));
    }).join('');
    return html;
  },
  getVal(path,source){
    source=source||refs.DEFAULT_CONFIG;
    return path.split('.').reduce((obj,key)=>obj?.[key],source);
  },
  setVal(source,path,value){const parts=path.split('.');let obj=source;for(let i=0;i<parts.length-1;i++)obj=obj[parts[i]];obj[parts[parts.length-1]]=value;},
  validate(c){
    const {CharacterGrowthRules,RARITY_KEYS}=refs;
    const validStarSteps=steps=>Array.isArray(steps)&&steps.length===CharacterGrowthRules.maxStars&&steps.every(v=>Number.isFinite(v)&&v>=0);
    const errors=[],finite=v=>Number.isFinite(v),positive=v=>finite(v)&&v>0,nonNegative=v=>finite(v)&&v>=0,prob=v=>finite(v)&&v>=0&&v<=1,int=(v,min,max)=>Number.isInteger(v)&&v>=min&&v<=max;
    [c.criticalMerge.chance,c.goldenPiece.chance,c.orderSheet.starSecondThreshold,c.waveTiming.earlyTransitionAlivePct,c.enemy.types.ranged.rangePct,c.player.damageReductionBase,c.combatRules.critChanceCap,c.combatRules.defenseIgnoreCap,c.combatRules.pierceRateCap].forEach(v=>{if(!prob(v))errors.push('확률·비율 값은 0~1이어야 합니다.');});
    if(!positive(c.player.hp)||!positive(c.player.atk)||!nonNegative(c.player.def)||!positive(c.player.projectileSpeed))errors.push('플레이어 능력치를 확인해주세요.');
    const factorSets=[c.combatFactors.global,...c.moduleKeys.map(key=>c.combatFactors.modules[key])];
    if(factorSets.some(set=>!set||refs.COMBAT_FACTOR_KEYS.some(key=>!nonNegative(set[key]))))errors.push('1·2차 전투 팩터는 0 이상의 유한한 값이어야 합니다.');
    if(factorSets.some(set=>!prob(set.critChance)||!prob(set.defenseIgnore)||!prob(set.pierceRate)))errors.push('치명타율·방어 무시율·관통 피해율의 개별 설정값은 0~1이어야 합니다.');
    if(!positive(c.combatRules.defenseConstant)||!positive(c.combatRules.minimumDamage))errors.push('피해 계산 규칙 값을 확인해주세요.');
    if(!positive(c.field.width)||!positive(c.field.height)||!nonNegative(c.field.playerOffsetY)||!positive(c.field.maxAnisotropy))errors.push('전장 크기·표시 값을 확인해주세요.');
    // [2026-09-17] 기준을 영웅 스프라이트 최상단에서 영웅이 서는 줄로 바꿨다.
    // 이전 식(height-playerOffsetY-104*.88-1.2)은 104px 스프라이트의 꼭대기를 썼는데,
    // 2026-09-16 UI 정비에서 playerOffsetY가 42→72가 되며 영웅이 30px 올라가 기본값조차
    // 통과하지 못했다(heroTop 315.28 < coreY+coreRadius 339 → 항상 오류, 에디터 적용 불가).
    // 핵이 영웅 스프라이트 윗부분과 겹치는 것은 현재 구도상 정상이다 — 렌더 순서가
    // 핵 → 영웅이라 영웅이 핵 위에 그려지고, field.playerOffsetY 주석도 이 거리를 전제한다.
    // 실제로 지켜야 할 것은 핵이 "영웅이 서는 줄보다 위(적 쪽)"에 있어야 한다는 것뿐이다.
    const f=c.field,heroLineY=f.height-f.playerOffsetY;
    if(!positive(f.coreY)||!positive(f.coreRadius)||!nonNegative(f.enemyContactGap)||f.coreY<=f.coreRadius+46+f.enemyContactGap||f.coreY+f.coreRadius>=heroLineY||f.coreRadius>=f.width/2)errors.push('핵은 적의 이동 공간을 확보하고 영웅 줄보다 위에 배치해주세요.');
    if(!positive(f.spawnMargin)||f.spawnMargin>=f.width/2||f.spawnMargin<24+f.width*.09)errors.push('출현 여백은 적 몸체가 좌우 난간 안쪽에 들어오도록 설정해주세요.');
    if(!positive(c.enemy.base.travelTimeSec)||Object.values(c.enemy.types).some(t=>!positive(t.travelTimeSec))||!positive(c.enemy.types.ranged.projectileSpeed)||c.enemy.types.ranged.rangePct>=1)errors.push('도달 시간·투사체 속도는 양수이고 원거리 사거리 비율은 1 미만이어야 합니다.');
    const pr=c.presentation||{};
    if(!nonNegative(pr.hitStopSec)||!nonNegative(pr.killStopSec)||!nonNegative(pr.bossKillStopSec)||!prob(pr.hitStopTimeScale)||!nonNegative(pr.hitStopCooldownSec)||!nonNegative(pr.hitPushPx)||!positive(pr.hitPushRecoverSec)||!positive(pr.squashSec)||!prob(pr.squashAmount)||!nonNegative(pr.killAfterimageSec))errors.push('타격감 연출 값을 확인해주세요.');
    if(!positive(c.hitbox.enemyRadius)||!positive(c.hitbox.bossRadius)||!nonNegative(c.hitbox.laserEdgePad)||!positive(c.hitbox.homingHitDist)||!positive(c.hitbox.projectileRangeMul))errors.push('히트박스·명중 판정 값을 확인해주세요.');
    if(!nonNegative(c.generator.costPerPiece)||!positive(c.generator.holdIntervalSec)||!int(c.colors.count,3,c.colors.names.length))errors.push('생성기·색상 값을 확인해주세요.');
    if(!positive(c.orderGauge.maxCharge)||!positive(c.orderGauge.ordersPerGrant)||!nonNegative(c.orderGauge.midBossOrders)||!nonNegative(c.orderGauge.pointPerEnergy)||!nonNegative(c.orderGauge.pointPerMerge))errors.push('주문서 게이지 값을 확인해주세요.');
    if(c.orderSheet.qualityWeights.length!==3||c.orderSheet.qualityWeights.some(v=>!prob(v))||Math.abs(c.orderSheet.qualityWeights.reduce((a,b)=>a+b,0)-1)>.0001||!int(c.orderSheet.qualityPityMisses,1,999))errors.push('주문서 성급 확률 합은 1이고 보정 횟수는 1 이상의 정수여야 합니다.');
    if(!int(c.stage.startWave,1,28)||!int(c.stage.endWave,c.stage.startWave+1,29)||!int(c.stage.startCount,1,9999)||!int(c.stage.endCount,c.stage.startCount,9999)||!positive(c.stage.stageOneHpMul))errors.push('선형 물량·스테이지 1 HP 값을 확인해주세요.');
    if(!nonNegative(c.scoring.normalKill)||!nonNegative(c.scoring.midBoss)||!nonNegative(c.scoring.finalBoss)||!positive(c.scoring.pointsPerGrant)||!positive(c.scoring.energyPerGrant)||!nonNegative(c.scoring.startEnergy))errors.push('점수·에너지 값을 확인해주세요.');
    c.moduleKeys.forEach(key=>{const d=c.attackModules[key];if(!positive(d.baseDamageMul)||d.baseAttacksPerSec!==1)errors.push(`${d.label}의 기본 공격속도는 1이어야 합니다.`);});
    if(c.attackModules.damageBonusByLevel.length!==12||c.attackModules.speedBonusByLevel.length!==12||c.attackModules.damageBonusByLevel.some(v=>!nonNegative(v))||c.attackModules.speedBonusByLevel.some(v=>!nonNegative(v)))errors.push('미사일 강화 표는 음수가 아닌 Lv.1~12 값이 필요합니다.');
    if(!int(c.skillPickCount,1,Object.keys(c.skills).length)||!nonNegative(c.skillEnergy?.firstCost)||!nonNegative(c.skillEnergy?.costStep)||!nonNegative(c.meta?.skill?.durationUptimeGap)||c.meta.skill.durationUptimeGap>=0.9||Object.values(c.skills).some(d=>!positive(d.baseEffect)||(d.cooldownFromMaxDuration?!positive(d.durationSec)||!nonNegative(d.durationPerStar):!positive(d.cooldownSec))||(d.stunSec!==undefined&&!positive(d.stunSec))||(d.slowSec!==undefined&&(!positive(d.slowSec)||!nonNegative(d.slowPct)||d.slowPct>0.95))||(d.knockbackPx!==undefined&&!nonNegative(d.knockbackPx))||['atk','def','hp'].some(k=>!nonNegative(d.stats?.base?.[k])||!nonNegative(d.stats?.perLevel?.[k]))))errors.push('스킬 효과·쿨타임·장착 능력치를 확인해주세요.');
    if(!positive(c.enemy.base.hp)||!nonNegative(c.enemy.base.atk)||!int(c.enemy.defenseGrowth.freeStages,0,9999)||!nonNegative(c.enemy.defenseGrowth.perStage)||!positive(c.enemy.base.atkSpeed)||!nonNegative(c.enemy.hpStepPct)||!nonNegative(c.enemy.atkStepPct)||Object.values(c.enemy.types).some(type=>!nonNegative(type.defMul)))errors.push('적 능력치를 확인해주세요.');
    if(!positive(c.waveTiming.durationSec)||c.waveTiming.spawnRatios.some(v=>!nonNegative(v))||c.waveTiming.spawnRatios.reduce((a,b)=>a+b,0)<=0||c.waveTiming.spawnTimesSec.some(v=>!nonNegative(v)))errors.push('WAVE 타이밍을 확인해주세요.');
    const g=c.meta?.gacha;
    if(!g||!int(g.cost,0,1e9)||!int(g.resultsPerPull,1,50)||!int(g.startStarfire,0,1e9)||!nonNegative(g.characterWeight)||!nonNegative(g.skillWeight)||g.characterWeight+g.skillWeight<=0)errors.push('소환 비용과 카테고리 비율을 확인해주세요.');
    const sg=c.meta?.skill;if(!sg||!int(sg.duplicateShards,0,9999)||sg.shardSteps.length!==CharacterGrowthRules.maxStars-1||sg.shardSteps.some(v=>!int(v,1,9999))||!validStarSteps(sg.starStepPct))errors.push('스킬 성장 값을 확인해주세요.');
    if(!validStarSteps(c.meta?.character?.starStepPct))errors.push('수호자 성급 상승률은 6개의 0 이상 값이어야 합니다.');
    const ms=c.meta?.milestones;if(!ms||!Object.keys(ms).length||Object.values(ms).some(m=>!m||!int(m.target,1,1e9)||!int(m.targetStep,0,1e9)||!int(m.reward,0,1e9)||!int(m.rewardStep,0,1e9)||!int(m.rewardCap,0,1e9)))errors.push('마일스톤 값은 정수여야 하며 첫 목표는 1 이상이어야 합니다.');
    const rarities=RARITY_KEYS.map(k=>c.meta?.rarity?.[k]);
    if(rarities.some(r=>!r||!positive(r.statMul)||!positive(r.levelCostMul)||!nonNegative(r.gachaWeight)||!int(r.duplicateShards,0,9999)||
      !Array.isArray(r.shardSteps)||r.shardSteps.length!==CharacterGrowthRules.maxStars-1||r.shardSteps.some(v=>!int(v,1,9999))))
      errors.push('희귀도 값은 배율 양수·가중치 0 이상·조각 수 1 이상의 정수여야 합니다.');
    if(rarities.reduce((a,r)=>a+(Number(r?.gachaWeight)||0),0)<=0)errors.push('등급 가중치 합이 0이면 영입을 할 수 없습니다.');
    if(!positive(c.boss.midHpExtraMul)||!positive(c.boss.finalHpExtraMul)||!positive(c.boss.midAtkMul)||!positive(c.boss.finalAtkMul))errors.push('보스 배율을 확인해주세요.');
    return [...new Set(errors)];
  },
  apply(){
    const next=refs.cloneConfig(refs.DEFAULT_CONFIG);
    try{
      $$('#editor-panel input[data-path]').forEach(input=>this.setVal(next,input.dataset.path,input.type==='checkbox'?input.checked:Number(input.value)));
      $$('#editor-panel select[data-path]').forEach(select=>this.setVal(next,select.dataset.path,select.value));
    }catch(e){alert('밸런스 값 적용 오류: '+e.message);return;}
    const errors=this.validate(next);
    if(errors.length){alert('입력값을 확인해주세요.\n\n'+errors.join('\n'));return;}
    refs.replaceObjectContents(refs.DEFAULT_CONFIG,next);
    refs.setConfig(refs.cloneConfig(refs.DEFAULT_CONFIG));
    alert('적용했습니다. 오른쪽 게임의 다음 전투부터 반영됩니다.');
  },
  reset(){
    refs.replaceObjectContents(refs.DEFAULT_CONFIG,refs.FACTORY_DEFAULT_CONFIG);
    refs.setConfig(refs.cloneConfig(refs.DEFAULT_CONFIG));
    this.build();
    alert('기본값으로 복원했습니다.');
  },
};
